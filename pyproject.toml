[project]
name = "pndata"
version = "0.1.0"
description = "Perfect Numbers data hub: connectors, build runner, catalog and the `pn` CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6,<2",
    "geopandas>=1.2.0",
    "pandas>=3.0.6",
    "pyarrow>=21",
    "pyyaml>=6",
    "requests>=2.32",
    "typer>=0.27",
]

[project.scripts]
pn = "pndata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pndata"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["parity: reproduces published outputs; needs the data root and the legacy archive"]
