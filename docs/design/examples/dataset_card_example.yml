# ─────────────────────────────────────────────────────────────────────────────
id: crash.report_cost
title: Estimated comprehensive cost per crash (method 2026.1)
description: >
  Estimated comprehensive (incl. quality-adjusted life years) and economic cost of each crash.
  Injury/fatal crashes: persons by ACRS injury code × NHTSA 2019 unit cost (ref.acrs_injury_to_mais →
  ref.nhtsa_unit_cost_2019, Table 1-10). Property-damage-only crashes: vehicles × PDO unit cost.
  Converted to 2025 dollars with CPI-U (econ.cpi_u). Geography columns copied from crash.report_geo for convenience.
grain: one row per crash report
primary_key: [report_number]
access_mode: derived
build:
  sql: pipelines/crash/report_cost.sql
  depends_on: [crash.acrs_report, crash.acrs_person, crash.acrs_vehicle, crash.report_geo, ref.acrs_injury_to_mais, ref.nhtsa_unit_cost_2019, econ.cpi_u]
method_version: "2026.1"
parameters:
  dollar_year: 2025
  deflator: {series: CUUR0000SA0, from: "2019-06", to: "2025-06"}   # ≈1.259; parity run uses legacy_factor
  legacy_factor: null              # set to 1.26 to reproduce crash_cost_eval.csv exactly
  unit_cost_edition: "NHTSA DOT HS 813 403 (2019, revised 2023), Table 1-10"
parity: "With legacy_factor 1.26: matches 2026/crash_costs/data/crash_cost_eval.csv within $1 per crash (210,860 rows; 2024 $41.04B, 2025 $37.34B)."
caveats:
  - text: "Unit costs are national averages; individual crashes can differ by multiples (NHTSA)."
  - text: "Per-capita figures must state their window — use annualized_rate() for per-year values."
columns:
  - {name: report_number, type: varchar, description: "ACRS report number."}
  - {name: date, type: date, description: "Crash date."}
  - {name: year, type: smallint, description: "Crash year."}
  - {name: severity_code, type: tinyint, description: "1 fatal, 2 injury, 3 PDO.", codes: ref.acrs_severity}
  - {name: county_geoid, type: varchar, description: "5-digit county GEOID from point-in-polygon (geo.county, vintage 2024)."}
  - {name: tract_geoid, type: varchar, description: "11-digit tract GEOID (vintage 2024)."}
  - {name: place_geoid, type: varchar, description: "7-digit place GEOID; NULL outside any Census place."}
  - {name: cost_total_usd2025, type: double, description: "Comprehensive cost (economic + QALY), 2025 dollars."}
  - {name: cost_economic_usd2025, type: double, description: "Economic cost only (medical, EMS, productivity, insurance admin, workplace, legal, congestion, property damage), 2025 dollars."}
  - {name: cost_qaly_usd2025, type: double, description: "Quality-adjusted life-year component, 2025 dollars."}
  # … component columns (cost_medical_usd2025, …)
tests:
  - {unique: report_number}
  - {relationships: {column: report_number, to: crash.acrs_report}}
  - name: statewide_total_matches_published
    sql: "select year, sum(cost_total_usd2025)/1e9 as b from crash.report_cost where year = 2025 group by 1 having abs(b - 37.34) > 0.05"
    expect: no_rows
    severity: warn              # anchor from post 9; informational after methodology changes
