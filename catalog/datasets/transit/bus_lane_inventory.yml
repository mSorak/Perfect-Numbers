id: transit.bus_lane_inventory
title: BCDOT dedicated bus-lane inventory (2021 copy)
description: >
  Baltimore City DOT's dedicated-bus-lane line layer, in BCDOT's facility schema (the same schema as the bike
  facility layer), as hosted by MTA's consultant Mead & Hunt in a BCDOT-tagged ArcGIS Online map ("Baltimore City
  RHRs, Separated Bike Lanes, and Bus Lanes"). Each row is a block-level piece of lane with its status (current or
  under construction vs. recommended), project (North Avenue Streetscape, Charm City Circulator, …), side and hours.
  The nearest thing to an official bus-lane list that is public; reconcile with OSM via transit.bus_lane_segment.
grain: one row per mapped lane piece (usually one block, one side)
primary_key: [lane_id]
layer: staging
access_mode: mirror
source: bcdot_bus_lanes
build: {python: "pipelines/transit/bus_lane_sources.py:inventory"}
depends_on: ["raw:bcdot_bus_lanes/bus_lane_2021"]
license: {terms: "Public ArcGIS Online item", redistribution: attribution, citation: "Baltimore City DOT bus-lane layer, via Mead & Hunt ArcGIS Online (item 91dc583522d04fc5a90079f6e0d0ac46), retrieved {retrieved_at}"}
caveats:
  - date: "2026-10-17"
    text: "Last edited 2021-11 upstream. Lanes built or removed since then are not reflected; check against OSM (transit.bus_lane_existing) and imagery before publishing totals. 26 pieces are 'Recommended', not built."
  - date: "2026-10-17"
    text: "68 pieces have no street name or facility type (42 current, 26 recommended); they still carry geometry and status. 'One side' vs 'Both sides' is in `side`; when both sides are drawn as one line, lane-km is under-counted by length_m."
  - date: "2026-10-17"
    text: "status_code is BCDOT's STATUS1 code (2 on every row that has one); its meaning is not documented. Use inventory_status."
columns:
  - {name: lane_id, type: bigint, description: "Source OBJECTID."}
  - {name: gis_id, type: varchar, description: "BCDOT facility GIS ID."}
  - {name: city_street_id, type: varchar, description: "City street ID (ST_ID) as published."}
  - {name: street_name, type: varchar, description: "Street name as published (upper case)."}
  - {name: block_text, type: varchar, description: "Block description, e.g. '300 BLK W LOMBARD ST'."}
  - {name: from_street, type: varchar, description: "From cross street (mostly empty)."}
  - {name: to_street, type: varchar, description: "To cross street (mostly empty)."}
  - {name: inventory_status, type: varchar, description: "'Current/Under Construction' or 'Recommended' (DBL_Type)."}
  - {name: is_current, type: boolean, description: "inventory_status = 'Current/Under Construction'."}
  - {name: facility_type, type: varchar, description: "BCDOT facility type (Shared Bus-Bike Lane where filled)."}
  - {name: status_code, type: varchar, description: "BCDOT STATUS1 code as published (undocumented)."}
  - {name: oneway, type: varchar, description: "One-way flag as published."}
  - {name: side, type: varchar, description: "'One side' or 'Both sides'."}
  - {name: lane_count, type: integer, description: "Number of bus lanes as published."}
  - {name: project, type: varchar, description: "Project that built the lane (e.g. North Avenue Streetscape, CHARM CITY CIRCULATOR)."}
  - {name: owner, type: varchar, description: "Owner as published (BCDOT where filled)."}
  - {name: hours_open, type: varchar, description: "Hours the lane is bus-only, as published (e.g. 24/7)."}
  - {name: length_m, type: double, description: "Line length in metres (EPSG:26985)."}
  - {name: source_snapshot_id, type: varchar, description: "Raw snapshot id."}
  - {name: geometry, type: geometry, description: "LineString, OGC:CRS84."}
tests:
  - {unique: lane_id}
  - {accepted_values: {column: inventory_status, values: ["Current/Under Construction", "Recommended"]}}
  - name: current_length_band
    sql: "SELECT sum(length_m) / 1000 AS km FROM {this} WHERE is_current HAVING km NOT BETWEEN 15 AND 80"
  - name: in_baltimore_bbox
    sql: "SELECT lane_id FROM {this} WHERE ST_XMin(geometry) < -76.72 OR ST_XMax(geometry) > -76.52 OR ST_YMin(geometry) < 39.19 OR ST_YMax(geometry) > 39.38"
